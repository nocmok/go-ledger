version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/001_ledger_table.up.sql"
    queries: "internal/ledger/query/queries.sql"
    gen:
      go:
        package: "query"
        out: "internal/ledger/query"
        sql_package: "pgx/v5"
        emit_json_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"

  - engine: "postgresql"
    schema: "migrations/002_account_table.up.sql"
    queries: "internal/account/query/queries.sql"
    gen:
      go:
        package: "query"
        out: "internal/account/query"
        sql_package: "pgx/v5"
        emit_json_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"

  - engine: "postgresql"
    schema: "migrations/003_transaction_table.up.sql"
    queries: "internal/transaction/query/queries.sql"
    gen:
      go:
        package: "query"
        out: "internal/transaction/query"
        sql_package: "pgx/v5"
        emit_json_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - column: "transaction.error_code"
            go_type:
              type: string
              pointer: true
          - column: "transaction.error_message"
            go_type:
              type: string
              pointer: true